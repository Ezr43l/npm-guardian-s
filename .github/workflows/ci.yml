name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test resumable release artifact gate
        shell: bash
        run: bash .github/scripts/test-release-artifact.sh

      - name: Validate public contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "ghcr.io/ezr43l/npm-guardian-s:$version" unraid/my-NPM-Guardian.xml
          grep -F "ghcr.io/ezr43l/npm-guardian-s:$version" .env.example
          grep -F "LICENSE_SPDX=Apache-2.0" .env.example
          test -f LICENSE
          test "$(grep -Fc 'Target="/var/run/docker.sock"' unraid/my-NPM-Guardian.xml)" = 1
          test "$(grep -Fc '<Config ' unraid/my-NPM-Guardian.xml)" = 5
          if grep -F 'Type="Variable"' unraid/my-NPM-Guardian.xml; then
            echo "La plantilla vuelve a exponer configuración interna como variables" >&2
            exit 1
          fi
          test ! -e unraid/my-NPM-Guardian-Docker-Control.xml
          if grep -R -E '__[A-Z0-9_]+__' unraid; then
            echo "La plantilla contiene marcadores sin resolver" >&2
            exit 1
          fi
          if grep -R -E '10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.' \
              --exclude-dir=.git --exclude-dir=tests --exclude='CHANGELOG.md' \
              unraid .env.example docker-compose.yml; then
            echo "Hay direcciones privadas incrustadas en artefactos de instalacion" >&2
            exit 1
          fi

      - name: Validate Compose, XML and shell
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config --quiet
          python -c "import glob, xml.etree.ElementTree as E; [E.parse(path) for path in glob.glob('unraid/*.xml')]"
          bash -n build-image.sh deploy-guardian.sh

      - name: Audit Python dependencies and source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip-audit==2.10.1 bandit==1.9.4
          pip-audit --requirement docker/guardian/requirements.txt
          bandit -r docker/guardian/panel -q

      - name: Build image and run embedded tests
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \r\n' < VERSION)"
          docker build --pull --tag npm-guardian:ci \
            --file docker/guardian/Dockerfile --target runtime \
            --build-arg "APP_VERSION=$version" \
            --build-arg "VCS_REF=${GITHUB_SHA}" .

      - name: Check runtime metadata and tests marker
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \r\n' < VERSION)"
          test "$(docker image inspect npm-guardian:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
          test "$(docker image inspect npm-guardian:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/Ezr43l/npm-guardian-s"
          test "$(docker image inspect npm-guardian:ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "Apache-2.0"
          docker run --rm --entrypoint test npm-guardian:ci -f /opt/tests-passed
          docker run --rm --entrypoint test npm-guardian:ci -f /opt/LICENSE

      - name: Reject critical or high vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --skip-version-check --scanners vuln \
            --severity CRITICAL,HIGH --exit-code 1 npm-guardian:ci

      - name: Exercise the single-container Docker boundary against supported NPM
        shell: pwsh
        run: |
          ./tests/secure_single_container_lab.ps1 `
            -GuardianImage npm-guardian:ci `
            -NpmImage jc21/nginx-proxy-manager:2.15.1@sha256:52b2c59994f3d36acfcf70a1626f29734df0ed8c71bacc0269f78b6f939858bb

      - name: Secret scan of the release tree
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-git --redact --exit-code=1
